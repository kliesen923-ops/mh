<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2D 헌터 로그라이크 아레나</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; touch-action: none; }
        canvas { display: block; background: #1a1a1a; }
        #hud { position: absolute; top: 20px; left: 20px; width: 154px; background: rgba(0, 0, 0, 0.6); padding: 12px; border-radius: 8px; color: white; font-size: 13px; z-index: 500; pointer-events: none; }
        #hp-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-weight: bold; }
        #hp-bar { width: 100%; height: 10px; background: #333; border-radius: 5px; overflow: hidden; margin-bottom: 10px; }
        #hp-fill { height: 100%; width: 100%; background: linear-gradient(to right, #2ecc71, #f1c40f); transition: width 0.2s; }
        #damage-readout { color: #ddd; line-height: 1.5; }
        #damage-readout b { color: #f1c40f; }
        #leaderboard { position: absolute; top: 20px; right: 20px; background: rgba(0, 0, 0, 0.6); padding: 15px; border-radius: 8px; color: white; font-size: 14px; min-width: 180px; z-index: 500; pointer-events: none; }
        #leaderboard h3 { margin: 0 0 10px 0; font-size: 16px; color: #f1c40f; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .score-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .level-badge { background: #f1c40f; color: black; padding: 0 5px; border-radius: 4px; font-weight: bold; margin-right: 5px; font-size: 11px; }
        #chat-container { position: absolute; bottom: 20px; left: 20px; width: 300px; height: 180px; background: rgba(0, 0, 0, 0.4); border-radius: 8px; display: flex; flex-direction: column; z-index: 200; pointer-events: none; }
        #chat-container.active { background: rgba(0, 0, 0, 0.7); pointer-events: auto; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 10px; color: white; font-size: 13px; text-shadow: 1px 1px 1px black; }
        #chat-input-container { padding: 8px; display: none; }
        #chat-input { width: 100%; background: rgba(255, 255, 255, 0.2); border: 1px solid #555; color: white; padding: 5px 10px; border-radius: 4px; outline: none; box-sizing: border-box; }
        .action-buttons { position: absolute; bottom: 50px; right: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; z-index: 100; }
        .btn { --cooldown-progress: 0; position: relative; width: 70px; height: 70px; background: rgba(40,40,40,0.7); border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; background: conic-gradient(#f1c40f calc(var(--cooldown-progress) * 1turn), transparent 0); opacity: 0; pointer-events: none; -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); transition: opacity 0.12s linear; }
        .btn.cooling { filter: brightness(0.72); }
        .btn.cooling::after { opacity: 1; }
        #btn-attack { background: rgba(192, 57, 43, 0.7); width: 90px; height: 90px; grid-column: 2; grid-row: 2; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; color: white; }
        .hidden { display: none !important; }
        #upgrade-cards { display: flex; gap: 15px; margin-top: 20px; flex-wrap: wrap; justify-content: center; width: 95%; max-width: 800px; }
        .card { flex: 1 1 120px; max-width: 180px; height: 220px; background: linear-gradient(135deg, #2c3e50, #000); border: 3px solid #f1c40f; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; padding: 15px; text-align: center; box-sizing: border-box; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 0 15px #f1c40f; }
        .card h4 { color: #f1c40f; margin: 0 0 10px 0; font-size: 16px; }
        .card p { font-size: 12px; line-height: 1.4; color: #ddd; margin: 0; }
        .card .icon { font-size: 30px; margin-bottom: 10px; }
        #upgrade-timer { font-size: 24px; color: #e74c3c; font-weight: bold; margin-top: 20px; text-shadow: 0 0 10px rgba(231, 76, 60, 0.5); }
        #joy-container { position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 100; border: 2px solid rgba(255,255,255,0.2); }
        #joy-stick { width: 50px; height: 50px; background: rgba(255,255,255,0.4); border-radius: 50%; position: absolute; pointer-events: none; }
        #nickname-input { width: min(260px, calc(100vw - 40px)); margin: 14px 0; padding: 12px 14px; border: 1px solid #555; border-radius: 8px; background: rgba(255,255,255,0.12); color: white; outline: none; font-size: 16px; text-align: center; box-sizing: border-box; }
        #nickname-input:focus { border-color: #f1c40f; box-shadow: 0 0 0 2px rgba(241,196,15,0.2); }
        #nickname-input::placeholder { color: rgba(255,255,255,0.55); }
        #nickname-error { min-height: 18px; color: #e74c3c; font-size: 12px; margin-bottom: 10px; }

        @media (max-width: 700px), (max-height: 500px) {
            #hud {
                top: calc(10px + env(safe-area-inset-top));
                left: 10px;
                width: min(133px, calc(50vw - 18px));
                padding: 9px;
                font-size: 11px;
            }
            #hp-row { margin-bottom: 5px; }
            #hp-bar { height: 8px; margin-bottom: 7px; }
            #damage-readout { line-height: 1.35; }
            #leaderboard {
                top: calc(10px + env(safe-area-inset-top));
                right: 10px;
                min-width: 0;
                width: min(180px, calc(50vw - 18px));
                padding: 9px;
                font-size: 11px;
            }
            #leaderboard h3 { font-size: 12px; margin-bottom: 6px; padding-bottom: 4px; }
            .level-badge { font-size: 9px; padding: 0 4px; margin-right: 3px; }
            .score-row { gap: 6px; }
            .score-row span:first-child {
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            #chat-container {
                left: 10px;
                bottom: calc(176px + env(safe-area-inset-bottom));
                width: calc(100vw - 20px);
                height: 88px;
                border-radius: 6px;
                z-index: 90;
            }
            #chat-messages { padding: 7px; font-size: 11px; }
            #chat-input-container { padding: 6px; }
            #joy-container {
                left: 18px;
                bottom: calc(22px + env(safe-area-inset-bottom));
                width: 104px;
                height: 104px;
            }
            #joy-stick { width: 42px; height: 42px; }
            .action-buttons {
                right: 16px;
                bottom: calc(22px + env(safe-area-inset-bottom));
                gap: 10px;
            }
            .btn { width: 58px; height: 58px; font-size: 12px; border-width: 2px; }
            #btn-attack { width: 76px; height: 76px; font-size: 14px; }
            #upgrade-cards { gap: 10px; margin-top: 14px; }
            .card { flex-basis: 96px; max-width: 140px; height: 164px; padding: 9px; border-radius: 8px; }
            .card h4 { font-size: 13px; margin-bottom: 7px; }
            .card p { font-size: 11px; }
            .card .icon { font-size: 24px; margin-bottom: 7px; }
            #upgrade-timer { font-size: 18px; margin-top: 12px; }
            .overlay h1 { font-size: 26px; text-align: center; }
            .overlay p { max-width: calc(100vw - 32px); text-align: center; }
        }

        @media (max-width: 700px) and (orientation: portrait) {
            #hud { width: min(133px, calc(50vw - 18px)); }
            #leaderboard { width: calc(50vw - 18px); }
            #chat-container {
                bottom: calc(158px + env(safe-area-inset-bottom));
                height: 82px;
            }
            #joy-container {
                width: 96px;
                height: 96px;
                left: 16px;
            }
            .btn { width: 54px; height: 54px; }
            #btn-attack { width: 72px; height: 72px; }
            .action-buttons { right: 12px; gap: 8px; }
            #upgrade-cards {
                display: grid;
                grid-template-columns: 1fr;
                width: min(320px, calc(100vw - 32px));
            }
            .card {
                display: grid;
                grid-template-columns: 34px 1fr;
                align-content: center;
                align-items: center;
                max-width: none;
                width: 100%;
                height: 112px;
                gap: 4px 10px;
                text-align: left;
            }
            .card .icon { grid-row: 1 / span 2; margin: 0; width: 30px; text-align: center; }
            .card h4 { margin: 0 0 4px 0; }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            #hud, #leaderboard { max-height: 118px; overflow: hidden; }
            #chat-container {
                left: 140px;
                bottom: calc(14px + env(safe-area-inset-bottom));
                width: clamp(160px, calc(100vw - 420px), 300px);
                height: 96px;
            }
            #joy-container {
                left: 18px;
                bottom: calc(18px + env(safe-area-inset-bottom));
            }
            .action-buttons {
                right: 18px;
                bottom: calc(18px + env(safe-area-inset-bottom));
            }
            #upgrade-cards { max-width: calc(100vw - 32px); }
            .card { height: 142px; }
        }
    </style>
</head>
<body>
    <div id="hud">
        <div id="hp-row"><span>HP</span><span id="hp-text">100/100</span></div>
        <div id="hp-bar"><div id="hp-fill"></div></div>
        <div id="damage-readout">
            <div>1타: <b id="damage-basic">10</b></div>
            <div>2타: <b id="damage-second">20</b></div>
            <div>3타: <b id="damage-heavy">35</b></div>
        </div>
    </div>
    <div id="leaderboard"><h3>RANKING</h3><div id="score-list"></div></div>
    <div id="chat-container"><div id="chat-messages"></div><div id="chat-input-container"><input type="text" id="chat-input" placeholder="메시지 입력..." maxlength="50"></div></div>
    <div id="joy-container"><div id="joy-stick"></div></div>
    <div class="action-buttons">
        <div class="btn" id="btn-wire">그랩</div><div class="btn" id="btn-dodge">회피</div>
        <div class="btn" id="btn-guard">가드</div><div class="btn" id="btn-attack">공격</div>
    </div>
    
    <div id="overlay-start" class="overlay">
        <h1>HUNTER ARENA: LEVEL UP</h1>
        <input id="nickname-input" type="text" maxlength="10" placeholder="닉네임 2~10자" autocomplete="off">
        <div id="nickname-error"></div>
        <button onclick="startGame()" style="padding: 15px 40px; background: #e74c3c; color: white; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 18px;">참전하기</button>
    </div>

    <div id="overlay-upgrade" class="overlay hidden">
        <h1 style="color:#f1c40f; text-shadow: 0 0 10px #f1c40f; margin-bottom: 5px;">LEVEL UP!</h1>
        <p>능력치를 선택하여 더욱 강력해지세요.</p>
        <div id="upgrade-timer">남은 시간: 9초</div>
        <div id="upgrade-cards">
            <div class="card" onclick="selectUpgrade('dmg')"><div class="icon">⚔️</div><h4>공격력 강화</h4><p>모든 공격의 데미지가 <br><b>20%</b> 상승합니다.</p></div>
            <div class="card" onclick="selectUpgrade('range')"><div class="icon">📏</div><h4>사거리 강화</h4><p>공격의 리치와 범위가 <br><b>15%</b> 상승합니다.</p></div>
            <div class="card" onclick="selectUpgrade('speed')"><div class="icon">⚡</div><h4>공격 속도 강화</h4><p>공격 속도가 <br><b>25%</b> 상승합니다.</p></div>
            <div class="card" onclick="selectUpgrade('move')"><div class="icon">👟</div><h4>이동 속도 강화</h4><p>이동 속도가 <br><b>10%</b> 상승합니다.</p></div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

<script>
const socket = io();
const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
const VIEW_Y_SCALE = 0.7;

let gameState = 'TITLE', isChatting = false, isUpgrading = false, myId = null, allPlayers = {};
let pendingUpgrades = 0, upgradeTimerInterval = null, upgradeTimeLeft = 9;
const keys = {};

const player = {
    x: 400, y: 300, hp: 100, angle: 0, level: 1,
    isGuarding: false, guardCooldown: 0, guardActiveTimer: 0,
    isAttacking: false, isStunned: false, comboStep: 0, attackPhase: 0, attackTimer: 0, aAngle: 0,
    isDodging: false, dTimer: 0, dDX: 0, dDY: 0, dodgeCooldown: 0,
    wire: { active: false, tx: 0, ty: 0 }, wireCooldown: 0,
    moveDir: { x: 0, y: 0 }, animTime: 0,
    stats: { dmg: 1.0, range: 1.0, speed: 1.0, move: 1.0 }
};

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

socket.on('connect', () => { myId = socket.id; });
socket.on('currentPlayers', (data) => { 
    allPlayers = data; 
    if(data[myId]) { player.x = data[myId].x; player.y = data[myId].y; player.hp = data[myId].hp; player.stats = normalizeStats(data[myId].stats); player.level = data[myId].level; updateHUD(); }
    updateLeaderboard(); 
});
socket.on('newPlayer', (p) => { allPlayers[p.id] = p; updateLeaderboard(); });
socket.on('playerMoved', (p) => { 
    if(allPlayers[p.id]) { 
        allPlayers[p.id].x = p.x; allPlayers[p.id].y = p.y; allPlayers[p.id].angle = p.angle; 
        if(p.id === myId && player.isStunned) { player.x = p.x; player.y = p.y; }
    } 
});
socket.on('playerActionUpdate', (data) => { if(allPlayers[data.id]) Object.assign(allPlayers[data.id], data.action); });
socket.on('playerStunned', (data) => { if(allPlayers[data.id]) allPlayers[data.id].isStunned = data.stunned; if(data.id === myId) player.isStunned = data.stunned; });

socket.on('levelUp', (data) => {
    player.level = data.newLevel;
    pendingUpgrades += data.count;
    if (!isUpgrading) showUpgradeUI();
});

function showUpgradeUI() {
    isUpgrading = true;
    const upgradeOverlay = document.getElementById('overlay-upgrade');
    upgradeOverlay.classList.remove('hidden');
    upgradeOverlay.querySelector('h1').innerText = `LEVEL ${player.level} UP!`;
    
    Object.keys(keys).forEach(k => keys[k] = false);
    upgradeTimeLeft = 9;
    const timerEl = document.getElementById('upgrade-timer');
    timerEl.innerText = `남은 시간: ${upgradeTimeLeft}초`;
    if (upgradeTimerInterval) clearInterval(upgradeTimerInterval);
    upgradeTimerInterval = setInterval(() => {
        upgradeTimeLeft--;
        timerEl.innerText = `남은 시간: ${upgradeTimeLeft}초`;
        if (upgradeTimeLeft <= 0) { clearInterval(upgradeTimerInterval); selectUpgrade('dmg'); }
    }, 1000);
}

socket.on('upgradeApplied', () => {
    if (upgradeTimerInterval) clearInterval(upgradeTimerInterval);
    pendingUpgrades--;
    if (pendingUpgrades > 0) setTimeout(showUpgradeUI, 200);
    else { isUpgrading = false; document.getElementById('overlay-upgrade').classList.add('hidden'); }
});

socket.on('statsUpdate', (data) => { 
    allPlayers = data; 
    if(data[myId]) { player.hp = data[myId].hp; player.stats = normalizeStats(data[myId].stats); player.level = data[myId].level; updateHUD(); }
    updateLeaderboard(); 
});

socket.on('playerRespawn', (p) => { 
    allPlayers[p.id] = p; 
    if(p.id === myId) { 
        player.x = p.x; player.y = p.y; player.hp = 100; 
        player.isStunned = false; player.isGuarding = false; 
        player.level = p.level; player.stats = normalizeStats(p.stats); 
        updateHUD();
    } 
    updateLeaderboard(); 
});

socket.on('playerDisconnected', (id) => { delete allPlayers[id]; updateLeaderboard(); });
socket.on('chatMessage', (data) => {
    const msgEl = document.createElement('div');
    const nameEl = document.createElement('b');
    nameEl.style.color = '#f1c40f';
    nameEl.textContent = `${String(data.id).substring(0,4)}:`;
    msgEl.appendChild(nameEl);
    msgEl.appendChild(document.createTextNode(` ${String(data.message)}`));
    const messagesEl = document.getElementById('chat-messages');
    messagesEl.appendChild(msgEl);
    messagesEl.scrollTop = messagesEl.scrollHeight;
});

function updateLeaderboard() {
    const list = document.getElementById('score-list'); if(!list) return; list.innerHTML = '';
    Object.values(allPlayers).sort((a,b) => b.kills - a.kills).forEach(p => {
        const lvlTxt = p.level >= 10 ? "MAX" : "Lv." + (p.level || 1);
        const row = document.createElement('div');
        row.className = 'score-row';
        const left = document.createElement('span');
        const badge = document.createElement('span');
        badge.className = 'level-badge';
        badge.textContent = lvlTxt;
        left.appendChild(badge);
        left.appendChild(document.createTextNode(p.name || 'Hunter'));
        const score = document.createElement('span');
        score.textContent = `${p.kills || 0}K / ${p.deaths || 0}D`;
        row.appendChild(left);
        row.appendChild(score);
        list.appendChild(row);
    });
}

function formatDamage(value) {
    return String(Math.floor(value));
}

function normalizeStats(stats) {
    return Object.assign({ dmg: 1.0, range: 1.0, speed: 1.0, move: 1.0 }, stats || {});
}

function updateHUD() {
    const hpText = document.getElementById('hp-text');
    const hpFill = document.getElementById('hp-fill');
    const basicDamage = document.getElementById('damage-basic');
    const secondDamage = document.getElementById('damage-second');
    const heavyDamage = document.getElementById('damage-heavy');
    if (!hpText || !hpFill || !basicDamage || !secondDamage || !heavyDamage) return;

    const hp = Math.max(0, Math.ceil(player.hp || 0));
    hpText.textContent = `${hp}/100`;
    hpFill.style.width = `${Math.max(0, Math.min(100, hp))}%`;

    player.stats = normalizeStats(player.stats);
    const dmgScale = Number.isFinite(player.stats.dmg) ? player.stats.dmg : 1;
    basicDamage.textContent = formatDamage(10 * dmgScale);
    secondDamage.textContent = formatDamage(20 * dmgScale);
    heavyDamage.textContent = formatDamage(35 * dmgScale);
}

function updateCooldownButton(id, remaining, duration) {
    const el = document.getElementById(id);
    if (!el) return;
    const progress = duration > 0 ? Math.max(0, Math.min(1, remaining / duration)) : 0;
    el.style.setProperty('--cooldown-progress', progress.toFixed(3));
    el.classList.toggle('cooling', progress > 0);
}

function updateCooldownUI() {
    updateCooldownButton('btn-dodge', player.dodgeCooldown, 1.0);
    updateCooldownButton('btn-guard', player.guardCooldown, 1.0);
    updateCooldownButton('btn-wire', player.wireCooldown, 1.0);
}

function selectUpgrade(type) {
    if (upgradeTimerInterval) clearInterval(upgradeTimerInterval);
    socket.emit('selectUpgrade', type);
}

function update(dt) {
    if (gameState !== 'PLAYING' || isChatting || isUpgrading || player.hp <= 0 || player.isStunned) return;
    const prev = { x: player.x, y: player.y, angle: player.angle };
    let mx = 0, my = 0;
    if(keys['KeyW']) my -= 1; if(keys['KeyS']) my += 1; if(keys['KeyA']) mx -= 1; if(keys['KeyD']) mx += 1;
    if(player.moveDir.x !== 0 || player.moveDir.y !== 0) { mx = player.moveDir.x; my = player.moveDir.y; }

    if(player.isDodging) {
        player.x += player.dDX * 800 * dt; player.y += player.dDY * 800 * dt;
        player.dTimer -= dt; if(player.dTimer <= 0) { player.isDodging = false; socket.emit('playerAction', { isDodging: false }); }
    } else if(player.isAttacking) {
        player.x += Math.cos(player.aAngle) * 150 * dt; player.y += Math.sin(player.aAngle) * 150 * dt;
    } else if(player.wire.active) {
        const dx = player.wire.tx - player.x, dy = player.wire.ty - player.y, d = Math.hypot(dx,dy);
        if(d > 20) { player.x += (dx/d)*1200*dt; player.y += (dy/d)*1200*dt; } else { player.wire.active = false; socket.emit('playerAction', { wire: { active: false } }); }
    } else if(mx !== 0 || my !== 0) {
        player.stats = normalizeStats(player.stats);
        const d = Math.hypot(mx, my), s = (player.isGuarding ? 150 : 350) * player.stats.move * dt;
        player.x += (mx/d) * s; player.y += (my/d) * s; player.angle = Math.atan2(my, mx); player.animTime += dt * 10;
    } else player.animTime = 0;

    player.x = Math.max(25, Math.min(canvas.width - 25, player.x));
    player.y = Math.max(25, Math.min(canvas.height - 25, player.y));
    if (player.isGuarding) { player.guardActiveTimer += dt; if (player.guardActiveTimer >= 1.0) releaseGuard(); }
    
    if(player.guardCooldown > 0) player.guardCooldown -= dt;
    if(player.dodgeCooldown > 0) player.dodgeCooldown -= dt;
    if(player.wireCooldown > 0) player.wireCooldown -= dt;
    updateCooldownUI();

    if(allPlayers[myId]) {
        Object.assign(allPlayers[myId], {
            x: player.x, y: player.y, angle: player.angle, animTime: player.animTime, 
            isGuarding: player.isGuarding, guardActiveTimer: player.guardActiveTimer,
            isAttacking: player.isAttacking, isDodging: player.isDodging,
            comboStep: player.comboStep, attackPhase: player.attackPhase, aAngle: player.aAngle,
            wire: { active: player.wire.active, tx: player.wire.tx, ty: player.wire.ty },
            level: player.level, stats: player.stats, isUpgrading: isUpgrading
        });
    }
    if(prev.x !== player.x || prev.y !== player.y || prev.angle !== player.angle) socket.emit('playerMovement', { x: player.x, y: player.y, angle: player.angle });
    if(player.isAttacking) updateAttack(dt);
}

function updateAttack(dt) {
    player.attackTimer -= dt;
    if(player.attackPhase === 1 && player.attackTimer <= 0) {
        player.attackPhase = 2; player.attackTimer = 0.08 / player.stats.speed;
        socket.emit('playerAction', { attackPhase: 2 });
        const attackRange = 85 * player.stats.range;
        Object.keys(allPlayers).forEach(id => {
            if(id !== myId && allPlayers[id].hp > 0 && isTargetInAttackArc(allPlayers[id], attackRange)) socket.emit('playerHitTarget', id);
        });
    } else if(player.attackPhase === 2 && player.attackTimer <= 0) { player.attackPhase = 3; player.attackTimer = 0.15 / player.stats.speed; socket.emit('playerAction', { attackPhase: 3 }); }
    else if(player.attackPhase === 3 && player.attackTimer <= 0) { player.isAttacking = false; player.attackPhase = 0; socket.emit('playerAction', { isAttacking: false, attackPhase: 0 }); }
}

function isTargetInAttackArc(target, range) {
    const dx = target.x - player.x;
    const dy = target.y - player.y;
    if (Math.hypot(dx, dy) > range) return false;
    if (player.comboStep === 3) return true;
    const targetAngle = Math.atan2(dy, dx);
    const diff = getAngleDiff(player.aAngle || player.angle, targetAngle);
    return diff <= Math.PI * 0.65;
}

function getAngleDiff(a1, a2) {
    let diff = a1 - a2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    while (diff > Math.PI) diff -= Math.PI * 2;
    return Math.abs(diff);
}

function startGuard() { if (player.hp > 0 && !player.isStunned && player.guardCooldown <= 0) { player.isGuarding = true; player.guardActiveTimer = 0; socket.emit('playerAction', { isGuarding: true, guardStartTime: Date.now() }); } }
function releaseGuard() { if (player.isGuarding) { player.isGuarding = false; player.guardCooldown = 1.0; socket.emit('playerAction', { isGuarding: false }); } }
function startDodge() { if (player.hp <= 0 || player.isStunned || player.isDodging || player.isAttacking || player.dodgeCooldown > 0) return; player.isDodging = true; player.dTimer = 0.2; player.dDX = Math.cos(player.angle); player.dDY = Math.sin(player.angle); player.dodgeCooldown = 1.0; socket.emit('playerAction', { isDodging: true }); }
function startWire() {
    if(player.isAttacking || player.isDodging || player.hp <= 0 || player.isStunned || player.wireCooldown > 0) return;
    player.wireCooldown = 1.0;
    const tx = player.x + Math.cos(player.angle) * 500, ty = player.y + Math.sin(player.angle) * 500;
    let hitId = null;
    Object.keys(allPlayers).forEach(id => { if(id !== myId && allPlayers[id].hp > 0 && distToSegment({x: player.x, y: player.y}, {x: tx, y: ty}, allPlayers[id]) < 35) hitId = id; });
    if(hitId) { socket.emit('wireGrabHit', hitId); player.wire.active = true; player.wire.tx = allPlayers[hitId].x; player.wire.ty = allPlayers[hitId].y; socket.emit('playerAction', { wire: { active: true, tx: player.wire.tx, ty: player.wire.ty } }); setTimeout(() => { player.wire.active = false; socket.emit('playerAction', { wire: { active: false } }); }, 300); }
    else { player.wire.active = true; player.wire.tx = Math.max(25, Math.min(canvas.width-25, tx)); player.wire.ty = Math.max(25, Math.min(canvas.height-25, ty)); socket.emit('playerAction', { wire: { active: true, tx: player.wire.tx, ty: player.wire.ty } }); }
}
function distToSegment(p1, p2, p) { const l2 = Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2); if (l2 === 0) return Math.hypot(p.x - p1.x, p.y - p1.y); let t = Math.max(0, Math.min(1, ((p.x - p1.x) * (p2.x - p1.x) + (p.y - p1.y) * (p2.y - p1.y)) / l2)); return Math.hypot(p.x - (p1.x + t * (p2.x - p1.x)), p.y - (p1.y + t * (p2.y - p1.y))); }

window.addEventListener('keydown', e => {
    if (gameState === 'TITLE' && e.target && e.target.id === 'nickname-input') {
        if (e.code === 'Enter') startGame();
        return;
    }
    if (isChatting && e.code !== 'Enter') return;
    if (isUpgrading) return;
    if (e.code === 'Enter') { if (!isChatting) { isChatting = true; document.getElementById('chat-container').classList.add('active'); document.getElementById('chat-input-container').style.display = 'block'; Object.keys(keys).forEach(k => keys[k] = false); setTimeout(() => document.getElementById('chat-input').focus(), 10); e.preventDefault(); } return; }
    if (player.hp <= 0 || player.isStunned) return;
    keys[e.code] = true; if(e.code === 'Space') startDodge(); if(e.code === 'ShiftLeft') startGuard();
    if(e.code === 'KeyR' || e.code === 'KeyF') { if(player.isAttacking) return; player.isAttacking = true; player.comboStep = (player.comboStep % 3) + 1; player.attackPhase = 1; player.attackTimer = 0.12 / player.stats.speed; player.aAngle = player.angle; socket.emit('playerAction', { isAttacking: true, comboStep: player.comboStep, attackPhase: 1, aAngle: player.aAngle }); }
});
document.getElementById('chat-input').addEventListener('keydown', e => { if (e.code === 'Enter') { if (e.target.value.trim()) socket.emit('chatMessage', e.target.value); e.target.value = ''; e.target.blur(); isChatting = false; document.getElementById('chat-container').classList.remove('active'); document.getElementById('chat-input-container').style.display = 'none'; e.preventDefault(); e.stopPropagation(); } });
window.addEventListener('keyup', e => { keys[e.code] = false; if(e.code === 'ShiftLeft') releaseGuard(); });
window.addEventListener('mousedown', e => { if(gameState === 'PLAYING' && !isChatting && !isUpgrading && player.hp > 0 && !player.isStunned) { if(e.button === 0) { if(player.isAttacking) return; player.isAttacking = true; player.comboStep = (player.comboStep % 3) + 1; player.attackPhase = 1; player.attackTimer = 0.12 / player.stats.speed; player.aAngle = player.angle; socket.emit('playerAction', { isAttacking: true, comboStep: player.comboStep, attackPhase: 1, aAngle: player.aAngle }); } if(e.button === 2) { e.preventDefault(); startWire(); } } });
window.addEventListener('contextmenu', e => e.preventDefault());

function drawCharacter(p, color) {
    const { x, y, angle, animTime, isDodging, isGuarding, guardActiveTimer, isAttacking, isStunned, isUpgrading, comboStep, attackPhase, hp, name, aAngle, wire, stats } = p;
    if(wire && wire.active) { ctx.save(); ctx.beginPath(); ctx.setLineDash([5, 5]); ctx.moveTo(x, y); ctx.lineTo(wire.tx, wire.ty); ctx.strokeStyle = "#f1c40f"; ctx.lineWidth = 2; ctx.stroke(); ctx.restore(); }
    if(isGuarding) { const isPerfect = (guardActiveTimer < 0.5); ctx.save(); ctx.translate(x, y); ctx.rotate(angle); ctx.beginPath(); ctx.arc(0, 0, 45, -Math.PI/3, Math.PI/3); ctx.strokeStyle = isPerfect ? "rgba(0, 200, 255, 0.9)" : "rgba(52, 152, 219, 0.3)"; ctx.lineWidth = isPerfect ? 8 : 3; ctx.stroke(); ctx.fillStyle = isPerfect ? "rgba(0, 200, 255, 0.2)" : "rgba(52, 152, 219, 0.05)"; ctx.lineTo(0,0); ctx.fill(); ctx.restore(); }
    ctx.save(); if (isDodging) ctx.globalAlpha = 0.2; if (isUpgrading) { ctx.globalAlpha = 0.5; ctx.shadowBlur = 15; ctx.shadowColor = "#fff"; } ctx.fillStyle = "white"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center"; ctx.fillText(name, x, y - 65);
    ctx.fillStyle = "#444"; ctx.fillRect(x-25, y-60, 50, 6);
    ctx.fillStyle = isStunned ? "#9b59b6" : (hp > 30 ? "#2ecc71" : "#e74c3c"); ctx.fillRect(x-25, y-60, (hp/100)*50, 6);
    ctx.save(); ctx.translate(x, y); ctx.scale(1, VIEW_Y_SCALE); ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.arc(0, 0, 25, 0, Math.PI*2); ctx.fill(); ctx.restore();
    ctx.save(); ctx.translate(x, y); ctx.scale(1, VIEW_Y_SCALE); const leg = Math.sin(animTime || 0); ctx.fillStyle = "#34495e"; ctx.fillRect(-15, (leg>0?-8:8), 10, 25); ctx.fillRect(5, (leg<0?-8:8), 10, 25); ctx.rotate(angle); ctx.fillStyle = isStunned ? "#9b59b6" : color; ctx.beginPath(); ctx.arc(0,0,24,0,Math.PI*2); ctx.fill(); ctx.fillStyle = "#ffdbac"; ctx.beginPath(); ctx.arc(0,-12,14,0,Math.PI*2); ctx.fill();
    ctx.save(); let sRot = 0.8; if(isAttacking) { if(attackPhase === 1) sRot = (comboStep===2?1.5:-1.5); else if(attackPhase === 2) sRot = (comboStep===2?-1.2:1.2); else if(attackPhase === 3) sRot = (comboStep===2?-0.5:0.5); } else if(isGuarding) sRot = 0.2; ctx.rotate(sRot); ctx.fillStyle = "#ffdbac"; ctx.fillRect(15,18,20,10); ctx.fillStyle = comboStep===3?"#f1c40f":"#bdc3c7"; ctx.fillRect(35,18,60,10); ctx.restore(); ctx.restore(); ctx.restore();
    if(isAttacking && attackPhase === 2) { ctx.save(); ctx.translate(x, y); ctx.scale(1, VIEW_Y_SCALE); ctx.beginPath(); const ba = aAngle || angle; let sA = ba-2.0, eA = ba+0.5; let counter = false; if(comboStep===2) { sA = ba+2.0; eA = ba-0.5; counter = true; } else if(comboStep===3) { sA = ba-2.8; eA = ba+2.8; } const visualRange = 75 * (stats ? stats.range : 1.0); ctx.arc(0,0,visualRange,sA,eA,counter); ctx.strokeStyle = comboStep===3?"rgba(255,200,0,0.8)":"rgba(255,255,255,0.8)"; ctx.lineWidth = 20; ctx.lineCap = "round"; ctx.stroke(); ctx.restore(); }
}
function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height); ctx.strokeStyle = "#333"; ctx.lineWidth = 1;
    for(let i=0; i<canvas.width; i+=80) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
    Object.values(allPlayers).forEach(p => { if(p.hp > 0) drawCharacter(p, (p.id === myId) ? "#e67e22" : "#3498db"); });
    if(player.hp <= 0 && gameState === 'PLAYING') { ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle = "white"; ctx.font = "bold 30px sans-serif"; ctx.textAlign = "center"; ctx.fillText("패배했습니다! 3초 후 부활합니다.", canvas.width/2, canvas.height/2); }
    requestAnimationFrame(loop);
}
const joyContainer = document.getElementById('joy-container'), joyStick = document.getElementById('joy-stick');
let joyId = null;
joyContainer.addEventListener('pointerdown', e => { if(gameState === 'PLAYING' && !isChatting && !isUpgrading && player.hp > 0 && !player.isStunned) { joyId = e.pointerId; joyContainer.setPointerCapture(e.pointerId); } });
window.addEventListener('pointermove', e => { if(joyId === e.pointerId) { const r = joyContainer.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2; let dx = e.clientX - cx, dy = e.clientY - cy; const d = Math.hypot(dx, dy); if(d > 50) { dx *= 50/d; dy *= 50/d; } joyStick.style.transform = `translate(${dx}px, ${dy}px)`; player.moveDir = { x: dx/50, y: (dy/50)/VIEW_Y_SCALE }; } });
window.addEventListener('pointerup', e => { if(joyId === e.pointerId) { joyId = null; joyStick.style.transform = 'translate(0,0)'; player.moveDir = { x: 0, y: 0 }; } });
const bind = (id, fn, end) => { const el = document.getElementById(id); if(!el) return; el.addEventListener('pointerdown', e => { e.preventDefault(); if(gameState === 'PLAYING' && !isChatting && !isUpgrading) fn(); }); if(end) { el.addEventListener('pointerup', end); el.addEventListener('pointerleave', end); } };
bind('btn-attack', () => { if(player.isAttacking || player.hp <= 0 || player.isStunned) return; player.isAttacking = true; player.comboStep = (player.comboStep % 3) + 1; player.attackPhase = 1; player.attackTimer = 0.12 / player.stats.speed; player.aAngle = player.angle; socket.emit('playerAction', { isAttacking: true, comboStep: player.comboStep, attackPhase: 1, aAngle: player.aAngle }); });
bind('btn-dodge', startDodge); bind('btn-guard', startGuard, releaseGuard); bind('btn-wire', startWire);
let lastTime = 0; function loop(t) { if(!lastTime) lastTime = t; let dt = (t - lastTime)/1000; if(dt > 0.1) dt = 0.1; lastTime = t; update(dt); updateCooldownUI(); draw(); }
function normalizeNameInput(value) {
    return String(value || '').trim().replace(/\s+/g, '_').replace(/[^\p{L}\p{N}_]/gu, '').slice(0, 10);
}
function startGame() {
    const nicknameInput = document.getElementById('nickname-input');
    const errorEl = document.getElementById('nickname-error');
    const nickname = normalizeNameInput(nicknameInput ? nicknameInput.value : '');
    if (nickname && nickname.length < 2) {
        if (errorEl) errorEl.textContent = '닉네임은 2자 이상이어야 합니다.';
        return;
    }
    if (errorEl) errorEl.textContent = '';
    if (nickname) socket.emit('setName', nickname);
    document.getElementById('overlay-start').classList.add('hidden');
    gameState = 'PLAYING';
    requestAnimationFrame(loop);
}
</script>
